[package]
name = "midstudy-contract"
version = "0.1.0"
description = "Serde types for midstudy's contract (contract/*.schema.json, contract/api/*.schema.json), generated by typify at build time from schema.json, the bundle scripts/gen-contract.mjs writes."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
schemars = "0.8"
serde_json = "1"
typify = { version = "0.8", default-features = false }
