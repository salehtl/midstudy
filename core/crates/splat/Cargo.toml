# midstudy's splat kernels (docs/REFACTOR.md, track pipeline): the 3DGS PLY reader and writer (contract §1), the
# per-axis fit of a splat to --dims with its covariances (Σ' = S Σ S, through a symmetric 3×3 eigendecomposition), the
# engines' percentile extents, and SPZ v2 (encode with the coverage ranking and the 262,144 cap, decode for the
# self-check). Pure Rust, no I/O, no dependencies; called from Node through crates/wasm-pipeline.
[package]
name = "midstudy-splat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
proptest = { version = "1.7", default-features = false, features = ["std"] }

[lints]
workspace = true
