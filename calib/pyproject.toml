[project]
name = "midstudy-calib"
version = "0.1.0"
description = "midstudy-calib: ingest a room photo and fit the scene camera (MoGe-2 floor plane), keep-room alignment, and where each photo of a room was taken"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "opencv-python-headless>=4.10",
    "torch>=2.5",
    "huggingface-hub>=0.25",
    # Every calib.json, lighting.json and stdout result is validated against its schema before it is written.
    "jsonschema>=4.23",
    # MoGe-2 (v2.0.0), the last code commit before the MoGe-3 rewrite (74fbce0), which needs CUDA-only flex-gemm.
    "moge @ git+https://github.com/microsoft/MoGe@07444410f1e33f402353b99d6ccd26bd31e469e8",
    # align-room: Manhattan's ICP uses scipy.spatial, MASt3R scipy too (already locked through MoGe).
    "scipy>=1.13",
]

[project.optional-dependencies]
# align-room's learned solver, MASt3R (Gate A, docs/ROOMS.md §2; rooms/mast3r.py): its Python dependencies beyond
# calib's own. MASt3R's code (a pinned git checkout) and weights (a pinned Hugging Face revision) are fetched on first
# use into caches outside the repo. Without this extra, align-room answers with manhattan (or unplaced).
#   uv sync --project calib --extra rooms
rooms = [
    "roma>=1.5",
    "einops>=0.8",
    "safetensors>=0.4",
    "tqdm>=4.66",
]

[project.scripts]
midstudy-calib = "midstudy_calib.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# MoGe lists its demo and training extras as hard dependencies. The inference path needs none of them, and
# opencv-python would clash with opencv-python-headless (both install cv2).
exclude-dependencies = ["gradio", "opencv-python", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["mast3r: runs the real MASt3R on the golden room (the rooms extra; skipped without it, about 2 minutes)"]

# pyright --strict over src, tests and scripts (`calib/scripts/check.sh`, docs/REFACTOR.md §3 check:py). The one
# untyped boundary is MoGe/torch, wrapped once in moge_runner.py.
[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "PTH", "PL", "NPY", "PERF"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # numeric code: many branches, arguments and constants
    "RUF001", "RUF002", "RUF003",                          # the docs and messages use real typography (×, –, °)
    "PLC0415",                                             # imports inside functions on purpose: torch, cv2 and MoGe load lazily
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
