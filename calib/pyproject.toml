[project]
name = "midstudy-calib"
version = "0.1.0"
description = "midstudy-calib: ingest a room photo and fit the scene camera (MoGe-2 floor plane), plus keep-room alignment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "opencv-python-headless>=4.10",
    "torch>=2.5",
    "huggingface-hub>=0.25",
    # Every calib.json, lighting.json and stdout result is validated against its schema before it is written.
    "jsonschema>=4.23",
    # MoGe-2 (v2.0.0), the last code commit before the MoGe-3 rewrite (74fbce0), which needs CUDA-only flex-gemm.
    "moge @ git+https://github.com/microsoft/MoGe@07444410f1e33f402353b99d6ccd26bd31e469e8",
]

[project.scripts]
midstudy-calib = "midstudy_calib.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# MoGe lists its demo and training extras as hard dependencies. The inference path needs none of them, and
# opencv-python would clash with opencv-python-headless (both install cv2).
exclude-dependencies = ["gradio", "opencv-python", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# pyright --strict over src, tests and the scripts the checks run (`calib/scripts/check.sh`, docs/REFACTOR.md §3
# check:py). The one untyped boundary is MoGe/torch, wrapped once in moge_runner.py. calib_report.py (a measurement
# script from v1, untyped) is linted by ruff but not type-checked.
[tool.pyright]
include = ["src", "tests", "scripts/bench.py", "scripts/gen_contract_types.py"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "PTH", "PL", "NPY", "PERF"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # numeric code: many branches, arguments and constants
    "RUF001", "RUF002", "RUF003",                          # the docs and messages use real typography (×, –, °)
    "PLC0415",                                             # imports inside functions on purpose: torch, cv2 and MoGe load lazily
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
